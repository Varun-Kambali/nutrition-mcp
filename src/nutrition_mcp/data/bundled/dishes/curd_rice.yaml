id: curd_rice
name: Curd rice
aliases:
  - mosaranna
  - thayir sadam
  - dahi chawal
regions: [south]
diet: veg
servings: 4
cooked_weight_g: 840
ingredients:
  - ingredient_id: white_rice
    grams: 120
  - ingredient_id: curd
    grams: 250
  - ingredient_id: whole_milk
    grams: 80
  - ingredient_id: salt
    grams: 4
  - ingredient_id: sunflower_oil
    grams: 8  # tempering
  - ingredient_id: mustard_seeds
    grams: 2  # tempering
  - ingredient_id: urad_dal
    grams: 4  # tempering
  - ingredient_id: curry_leaves
    grams: 3  # tempering
  - ingredient_id: green_chilli
    grams: 6
  - ingredient_id: ginger
    grams: 5
  - ingredient_id: coriander_leaves
