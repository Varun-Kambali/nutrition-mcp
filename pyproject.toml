[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrition-mcp"
dynamic = ["version"]
description = "MCP server with sourced nutrition, glycemic load and micronutrient data for Indian dishes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Varun Kambali" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "rapidfuzz>=3.9",
    "pyyaml>=6",
]

[project.scripts]
nutrition-mcp = "nutrition_mcp.server:main"

[project.urls]
Repository = "https://github.com/Varun-Kambali/nutrition-mcp"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-openpyxl",
    "pre-commit",
]
build-data = ["openpyxl", "httpx"]
eval = ["google-genai"]

[tool.hatch.version]
path = "src/nutrition_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrition_mcp"]
artifacts = ["src/nutrition_mcp/data/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
# The eval and reference-build scripts are typed like the package. The second one imports
# scripts/build_ingredients.py, which mypy checks through it.
files = ["src", "evals", "scripts/build_references.py"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The eval and build scripts are not part of the package; tests import them from here.
pythonpath = ["evals", "scripts"]
addopts = "-ra --import-mode=importlib"
